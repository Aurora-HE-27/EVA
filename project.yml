name: EVA

options:
  bundleIdPrefix: com.aurorahe27
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    ARCHS: arm64
    DEVELOPMENT_LANGUAGE: zh-Hans
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.10"

packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.3
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.9.0
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.6

targets:
  EVA:
    type: application
    platform: macOS
    sources:
      - path: Sources/EVA
      - path: Vendor/swift-qwen3-tts/Sources/Qwen3TTS
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: HuggingFace
        product: HuggingFace
      - package: Transformers
        product: Tokenizers
      - package: Transformers
        product: Transformers
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXFast
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/EVA.entitlements
        CURRENT_PROJECT_VERSION: 15
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: 0.10.0
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lc++"
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorahe27.eva
        PRODUCT_NAME: EVA
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed local AI models
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          model_name="Qwen3.5-2B-MLX-4bit"
          model_source="${SRCROOT}/Resources/Models/${model_name}"
          model_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models/${model_name}"
          speech_model_name="Qwen3-TTS-12Hz-0.6B-CustomVoice-4bit"
          speech_model_source="${SRCROOT}/Resources/Models/${speech_model_name}"
          speech_model_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models/${speech_model_name}"

          if [[ ! -f "${model_source}/config.json" ]]; then
            echo "error: 未找到 EVA 本地模型：${model_source}"
            exit 1
          fi
          if [[ ! -f "${speech_model_source}/model.safetensors" ]] || [[ ! -f "${speech_model_source}/speech_tokenizer/model.safetensors" ]]; then
            echo "error: 未找到 EVA 神经语音模型：${speech_model_source}"
            exit 1
          fi
          /bin/mkdir -p "$(/usr/bin/dirname "${model_destination}")"
          /bin/rm -rf "${model_destination}"
          /usr/bin/ditto "${model_source}" "${model_destination}"
          /bin/rm -rf "${speech_model_destination}"
          /usr/bin/ditto "${speech_model_source}" "${speech_model_destination}"
    scheme:
      gatherCoverageData: true
      testTargets:
        - EVATests

  EVATests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/EVATests
    dependencies:
      - target: EVA
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aurorahe27.eva.tests
